# Base-side guard for the review-risk policy.
#
# pull_request_target executes this workflow from the base branch with a
# write-scoped token. Never execute PR-authored files here: the PR head is
# fetched only as git object data and inspected with the base-side shell.
name: review-risk-guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: review-risk-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-risk-guard:
    name: PR review risk guard (base-side)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # Default ref is the trusted base branch for pull_request_target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect self-modification
        id: guard
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$BASE_REF" != "main" ]; then
            echo "target=false" >> "$GITHUB_OUTPUT"
            echo "self=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "target=true" >> "$GITHUB_OUTPUT"
          git fetch origin "$HEAD_SHA"
          base="$(git merge-base HEAD FETCH_HEAD)"
          if ! git diff --quiet "$base" FETCH_HEAD -- \
            tools/reviewrisk \
            docs/review-risk.ja.md \
            .github/workflows/review-risk.yml \
            .github/workflows/review-risk-guard.yml
          then
            {
              echo '<!-- review-risk-guard -->'
              echo '## Review risk: **CRITICAL**（base 側ガード）'
              echo
              echo '人間精読必須。review-risk の判定器・正典・workflow 自身が変更されているため、base ブランチ側の自己改変ガードが fail-closed で critical に固定しました(S5)。この workflow は PR 側コードを実行しません。'
            } > comment.md
            echo "self=true" >> "$GITHUB_OUTPUT"
          else
            echo "self=false" >> "$GITHUB_OUTPUT"
          fi

          if git merge-tree --write-tree HEAD FETCH_HEAD >/dev/null; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare failed guard result
        id: fallback
        if: >-
          always() &&
          github.event.pull_request.base.ref == 'main' &&
          steps.guard.outcome != 'success'
        run: |
          set -euo pipefail
          {
            echo '<!-- review-risk-guard -->'
            echo '## Review risk: **CRITICAL**（base 側ガード）'
            echo
            echo '人間精読必須。base ブランチ側の自己改変判定を完了できなかったため、fail-closed で critical に固定しました。この workflow は PR 側コードを実行しません。'
          } > comment.md

      - name: Clear stale normal result outside main or while conflicting
        if: >-
          always() &&
          (
            steps.guard.outputs.target != 'true' ||
            steps.guard.outputs.conflict == 'true' ||
            steps.guard.outcome != 'success'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          ensure_current_pr() {
            local current expected
            current="$(gh api "repos/$GH_REPO/pulls/$PR" \
              --jq '[.base.ref, .base.sha, .head.sha, .head.repo.full_name] | @tsv')"
            expected="$(printf '%s\t%s\t%s\t%s' \
              "$EXPECTED_BASE_REF" "$EXPECTED_BASE_SHA" \
              "$EXPECTED_HEAD_SHA" "$EXPECTED_HEAD_REPO")"
            if [ "$current" != "$expected" ]; then
              echo "Skipping stale base guard mutation for $EXPECTED_HEAD_SHA"
              return 1
            fi
          }

          existing_labels="$(gh pr view "$PR" --json labels --jq '.labels[].name')"
          while IFS= read -r label; do
            case "$label" in
              review:*)
                ensure_current_pr || exit 0
                gh pr edit "$PR" --remove-label "$label"
                ;;
            esac
          done <<< "$existing_labels"

          existing_id="$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-risk -->")))][0].id // empty')"
          if [ -n "$existing_id" ]; then
            ensure_current_pr || exit 0
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$existing_id"
          fi

      - name: Clear stale guard critical label for fork PR
        if: >-
          steps.guard.outputs.target == 'true' &&
          steps.guard.outputs.self != 'true' &&
          github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          ensure_current_pr() {
            local current expected
            current="$(gh api "repos/$GH_REPO/pulls/$PR" \
              --jq '[.base.ref, .base.sha, .head.sha, .head.repo.full_name] | @tsv')"
            expected="$(printf '%s\t%s\t%s\t%s' \
              "$EXPECTED_BASE_REF" "$EXPECTED_BASE_SHA" \
              "$EXPECTED_HEAD_SHA" "$EXPECTED_HEAD_REPO")"
            if [ "$current" != "$expected" ]; then
              echo "Skipping stale base guard mutation for $EXPECTED_HEAD_SHA"
              return 1
            fi
          }

          has_critical="$(gh pr view "$PR" --json labels \
            --jq 'any(.labels[]; .name == "review:critical")')"
          if [ "$has_critical" = "true" ]; then
            ensure_current_pr || exit 0
            gh pr edit "$PR" --remove-label "review:critical"
          fi

      - name: Apply review:critical label
        if: >-
          always() &&
          (
            (
              steps.guard.outputs.target == 'true' &&
              steps.guard.outputs.self == 'true'
            ) ||
            steps.fallback.outcome == 'success'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          ensure_current_pr() {
            local current expected
            current="$(gh api "repos/$GH_REPO/pulls/$PR" \
              --jq '[.base.ref, .base.sha, .head.sha, .head.repo.full_name] | @tsv')"
            expected="$(printf '%s\t%s\t%s\t%s' \
              "$EXPECTED_BASE_REF" "$EXPECTED_BASE_SHA" \
              "$EXPECTED_HEAD_SHA" "$EXPECTED_HEAD_REPO")"
            if [ "$current" != "$expected" ]; then
              echo "Skipping stale base guard mutation for $EXPECTED_HEAD_SHA"
              return 1
            fi
          }

          ensure_current_pr || exit 0
          gh label create "review:none" --color cccccc --description "PR review risk: none" 2>/dev/null || true
          ensure_current_pr || exit 0
          gh label create "review:low" --color 0e8a16 --description "PR review risk: low" 2>/dev/null || true
          ensure_current_pr || exit 0
          gh label create "review:medium" --color fbca04 --description "PR review risk: medium" 2>/dev/null || true
          ensure_current_pr || exit 0
          gh label create "review:high" --color d93f0b --description "PR review risk: high" 2>/dev/null || true
          ensure_current_pr || exit 0
          gh label create "review:critical" --color b60205 --description "PR review risk: critical" 2>/dev/null || true

          existing_labels="$(gh pr view "$PR" --json labels --jq '.labels[].name')"
          while IFS= read -r label; do
            case "$label" in
              review:*)
                if [ "$label" != "review:critical" ]; then
                  ensure_current_pr || exit 0
                  gh pr edit "$PR" --remove-label "$label"
                fi
                ;;
            esac
          done <<< "$existing_labels"

          ensure_current_pr || exit 0
          gh pr edit "$PR" --add-label "review:critical"

      - name: Reconcile guard sticky comment
        if: >-
          always() &&
          (
            github.event.pull_request.base.ref != 'main' ||
            steps.guard.outcome == 'success' ||
            steps.fallback.outcome == 'success'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SELF: ${{ (steps.guard.outputs.self == 'true' || steps.fallback.outcome == 'success') && 'true' || 'false' }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          ensure_current_pr() {
            local current expected
            current="$(gh api "repos/$GH_REPO/pulls/$PR" \
              --jq '[.base.ref, .base.sha, .head.sha, .head.repo.full_name] | @tsv')"
            expected="$(printf '%s\t%s\t%s\t%s' \
              "$EXPECTED_BASE_REF" "$EXPECTED_BASE_SHA" \
              "$EXPECTED_HEAD_SHA" "$EXPECTED_HEAD_REPO")"
            if [ "$current" != "$expected" ]; then
              echo "Skipping stale base guard mutation for $EXPECTED_HEAD_SHA"
              return 1
            fi
          }

          existing_id="$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-risk-guard -->")))][0].id // empty')"

          if [ "$SELF" = "true" ]; then
            if [ -n "$existing_id" ]; then
              ensure_current_pr || exit 0
              gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing_id" -F body=@comment.md
            else
              ensure_current_pr || exit 0
              gh api --method POST "repos/$GH_REPO/issues/$PR/comments" -F body=@comment.md
            fi
          elif [ -n "$existing_id" ]; then
            ensure_current_pr || exit 0
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$existing_id"
          fi

      - name: Fail workflow after publishing fail-closed guard result
        if: always() && steps.fallback.outcome == 'success'
        run: exit 1
