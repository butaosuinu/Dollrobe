name = "doll-wardrobe-api"
main = "workers/src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
tsconfig = "tsconfig.workers.json"

[[d1_databases]]
binding = "DB"
database_name = "doll-wardrobe-db"
database_id = "YOUR_D1_ID"
migrations_dir = "workers/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "doll-wardrobe-images"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_ID"

[[queues.producers]]
binding = "QUEUE"
queue = "doll-wardrobe-digest"

[[queues.consumers]]
queue = "doll-wardrobe-digest"
max_batch_size = 10

[triggers]
crons = ["0 9 * * 1"]

[vars]
TRUSTED_ORIGINS = "http://localhost:3000,http://localhost:3001"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001"
LOG_LEVEL = "info"

[env.staging]
name = "doll-wardrobe-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "doll-wardrobe-db"
database_id = "YOUR_D1_STAGING_ID"
migrations_dir = "workers/migrations"

[env.production]
name = "doll-wardrobe-api-production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "doll-wardrobe-db"
database_id = "YOUR_D1_PRODUCTION_ID"
migrations_dir = "workers/migrations"
